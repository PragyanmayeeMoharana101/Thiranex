<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager | Thiranex To-Do App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link src="script.js">
</head>
<body>
  <div class="app-container">
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div>
          <h1>Task Manager</h1>
          <p class="subtitle">Streamline your daily workflow with state-driven simplicity.</p>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Add Task Form -->
      <section class="add-task-section" aria-labelledby="add-task-heading">
        <h2 id="add-task-heading" class="sr-only">Add New Task</h2>
        <form id="add-task-form" class="task-form" novalidate>
          <div class="input-wrapper">
            <label for="task-input" class="sr-only">What needs to be done?</label>
            <input 
              type="text" 
              id="task-input" 
              class="task-input" 
              placeholder="What needs to be done?" 
              autocomplete="off"
              maxlength="200"
            />
            <button type="submit" id="add-task-btn" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add Task</span>
            </button>
          </div>
          <div id="input-error" class="input-error" aria-live="polite"></div>
        </form>
      </section>

      <!-- Task Controls & Filters -->
      <section class="controls-section">
        <div class="filters" role="tablist" aria-label="Task filters">
          <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true" id="filter-all">
            All <span class="filter-badge" id="badge-all">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false" id="filter-active">
            Active <span class="filter-badge" id="badge-active">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false" id="filter-completed">
            Completed <span class="filter-badge" id="badge-completed">0</span>
          </button>
        </div>

        <button type="button" id="clear-completed-btn" class="btn-link danger" title="Clear all completed tasks">
          Clear Completed
        </button>
      </section>

      <!-- Task List Container -->
      <section class="task-list-section" aria-labelledby="task-list-heading">
        <h2 id="task-list-heading" class="sr-only">Task List</h2>
        
        <ul id="task-list" class="task-list" role="list">
          <!-- Dynamic task items rendered here via JS event delegation -->
        </ul>

        <!-- Contextual Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon" id="empty-icon"></div>
          <h3 id="empty-title" class="empty-title">No tasks found</h3>
          <p id="empty-description" class="empty-description">Add a task above to get started!</p>
        </div>
      </section>

      <!-- Summary & Statistics Footer -->
      <footer class="task-footer">
        <div class="stats-primary" id="stats-remaining">
          <strong>0</strong> tasks remaining
        </div>
        <div class="stats-breakdown" id="stats-breakdown">
          Total: <span id="stat-total">0</span> | Active: <span id="stat-active">0</span> | Completed: <span id="stat-completed">0</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Edit Task Modal Dialog -->
  <dialog id="edit-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close edit dialog">&times;</button>
      </div>
      <form id="edit-task-form" novalidate>
        <div class="modal-body">
          <label for="edit-task-input" class="form-label">Task description</label>
          <input 
            type="text" 
            id="edit-task-input" 
            class="task-input modal-input" 
            maxlength="200" 
            required 
          />
          <div id="edit-input-error" class="input-error" aria-live="polite"></div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="save-edit-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
